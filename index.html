// ===============================
// ガイド表示
// ===============================
function showGuide(){
  const q = QUESTIONS[idx];
  const g = GUIDE[q.no];
  const box = document.getElementById("guideBox");

  if(!g){
    box.innerHTML = "<p>この質問のガイドは未登録です。</p>";
  }else{
    box.innerHTML =
      `<p><strong>① 結論の作り方：</strong><br>${g.c1}</p>`+
      `<p><strong>② 理由の組み立て方：</strong><br>${g.c2}</p>`+
      `<p><strong>③ 具体例の示し方：</strong><br>${g.c3}</p>`+
      `<p><strong>④ 大学での学びにつなげる方法：</strong><br>${g.c4}</p>`+
      `<p><strong>⑤ 評価ポイント：</strong><br>${g.c5}</p>`+
      `<p><strong>⑥ 注意点：</strong><br>${g.c6}</p>`;
  }

  box.style.display = "block";
}

// ===============================
// 質問の表示
// ===============================
function render(){
  const q = QUESTIONS[idx];

  document.getElementById("meta").textContent =
    `No.${q.no}｜分野：${q.field}｜難度：${q.level}｜目安：${q.time}`;

  document.getElementById("question").textContent = q.q;
  document.getElementById("deepQuestion").textContent = "深掘り質問：" + q.deep;

  document.getElementById("status").textContent =
    "結論→理由→具体例→大学での学び の順で書いてみる";

  document.getElementById("answerInput").value = "";
  document.getElementById("guideBox").style.display = "none";
}

// ===============================
// 次の質問へ
// ===============================
function next(){
  idx = (idx + 1) % QUESTIONS.length;
  render();
}

// ===============================
// 初期表示
// ===============================
render();
