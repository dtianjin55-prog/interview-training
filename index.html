let filtered = [...questions];
let currentIndex = 0;

const container = document.getElementById("questionContainer");
const indexGrid = document.getElementById("indexGrid");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const filterField = document.getElementById("filterField");
const filterLevel = document.getElementById("filterLevel");
const searchText = document.getElementById("searchText");

function renderQuestion() {
  if (filtered.length === 0) {
    container.innerHTML = "<p>条件に合う質問がありません。フィルターを緩めてください。</p>";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  if (currentIndex < 0) currentIndex = 0;
  if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
  const q = filtered[currentIndex];
  container.innerHTML = `
    <div class="question-header">
      <div class="question-header-left">
        <div class="question-no">No.${q.no}</div>
        <div class="question-meta">
          <span class="badge badge-field">${q.field}</span>
          <span class="badge badge-level">${q.level}</span>
          <span class="badge badge-time">${q.time}</span>
        </div>
      </div>
      <div class="question-meta">全 ${filtered.length} 問中 ${currentIndex + 1} 問目</div>
    </div>
    <div class="question-text">${q.question}</div>
    <div class="deep-question">深掘り質問：${q.deep}</div>
    <div class="section-title">回答の骨格（話す順番の型）</div>
    <div class="section-body">${q.skeleton}</div>
    <div class="section-title">回答例・要点（そのまま暗記せず、自分の経験に置き換える）</div>
    <div class="section-body">${q.answer}</div>
    <div class="section-title">評価ポイント（自分の回答をチェック）</div>
    <div class="section-body">${q.eval}</div>
    <div class="section-title">注意点（言い過ぎ・偏りを避ける）</div>
    <div class="section-body">${q.caution}</div>
  `;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === filtered.length - 1;
  renderIndexGrid();
}

function renderIndexGrid() {
  indexGrid.innerHTML = "";
  filtered.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "index-item" + (idx === currentIndex ? " active" : "");
    div.innerHTML = `${q.no}<span>${q.field}</span>`;
    div.onclick = () => {
      currentIndex = idx;
      renderQuestion();
    };
    indexGrid.appendChild(div);
  });
}

function applyFilter() {
  const field = filterField.value;
  const level = filterLevel.value;
  const text = searchText.value.trim();
  filtered = questions.filter(q => {
    if (field !== "all" && q.field !== field) return false;
    if (level !== "all" && q.level !== level) return false;
    if (text) {
      const t = text.toLowerCase();
      const joined = (q.question + q.deep + q.answer + q.skeleton).toLowerCase();
      if (!joined.includes(t)) return false;
    }
    return true;
  });
  currentIndex = 0;
  renderQuestion();
}

prevBtn.onclick = () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
};
nextBtn.onclick = () => {
  if (currentIndex < filtered.length - 1) {
    currentIndex++;
    renderQuestion();
  }
};
filterField.onchange = applyFilter;
filterLevel.onchange = applyFilter;
searchText.oninput = applyFilter;

renderQuestion();
</script>
